# Levanta todo el proyecto con un solo comando:   docker compose up --build
# Antes, una sola vez: copia .env.example como .env (trae un valor de ejemplo para cada variable).
# La aplicación responde en http://localhost:8080 (o en el WEB_PUERTO de .env). Es el único puerto publicado:
# la base de datos, la API, Mailpit y el enviador solo se ven dentro de la composición, por su nombre de servicio.
# Para detenerlo: docker compose down   (los datos quedan en los volúmenes; down -v sí los borra).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    # Sin puerto publicado. Para leer la base: docker compose exec db psql -U <POSTGRES_USER> -d <POSTGRES_DB>
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      ConnectionStrings__Inventario: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      URL_PUBLICA: ${URL_PUBLICA:?Falta URL_PUBLICA en .env}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:?Falta ADMIN_NOMBRE en .env}
      ADMIN_CORREO: ${ADMIN_CORREO:?Falta ADMIN_CORREO en .env}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env}
      # Clave de la API externa de tasas de cambio (RD-10). Opcional: sin ella la API arranca y solo la cotización se rechaza.
      TASA_CAMBIO_API_CLAVE: ${TASA_CAMBIO_API_CLAVE:-}
    volumes:
      # Los archivos de los documentos (RF-DOC-05): un volumen con nombre, fuera de la imagen.
      - documentos:/datos/documentos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PUERTO:-8080}:80"
    depends_on:
      - api
      - mailpit
    restart: unless-stopped

  # Servidor SMTP de pruebas: recibe todos los correos y no envía nada afuera. Su bandeja se ve en
  # http://localhost:8080/correo/ (nginx la reenvía); no publica un puerto propio.
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_WEBROOT: correo
      # Acepta cualquier usuario y contraseña SMTP, como los de ejemplo de .env.example.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    restart: unless-stopped

  # Proceso independiente que entrega la cola de correos (RF-NOT-09): revisa la cola cada 5 segundos.
  # Una pasada suelta, si la quieres: docker compose run --rm enviador
  enviador:
    build:
      context: .
      target: enviador
    command: ["--vigilar", "5"]
    environment:
      ConnectionStrings__Inventario: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      SMTP_HOST: ${SMTP_HOST:?Falta SMTP_HOST en .env}
      SMTP_PUERTO: ${SMTP_PUERTO:?Falta SMTP_PUERTO en .env}
      SMTP_SEGURIDAD: ${SMTP_SEGURIDAD:?Falta SMTP_SEGURIDAD en .env}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CONTRASENA: ${SMTP_CONTRASENA:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:?Falta SMTP_REMITENTE en .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Las pruebas automáticas (RD-12) están en docker-compose.pruebas.yml: así corren sin .env.

volumes:
  # Usuarios, solicitudes, inventario y registros de documentos (RD-09).
  datos-postgres:
  # Contenido de los documentos subidos (RF-DOC-05).
  documentos:
