# Levanta todo con: docker compose up --build
# Las variables salen de .env (copia .env.example y complétalo). Si falta una obligatoria, compose se detiene y la nombra.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    # Sin puerto publicado: así no choca con otro PostgreSQL de la máquina.
    # Para leer la base: docker compose exec db psql -U <POSTGRES_USER> -d <POSTGRES_DB>
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: api
    environment:
      ConnectionStrings__Inventario: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      URL_PUBLICA: ${URL_PUBLICA:?Falta URL_PUBLICA en .env}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:?Falta ADMIN_NOMBRE en .env}
      ADMIN_CORREO: ${ADMIN_CORREO:?Falta ADMIN_CORREO en .env}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PUERTO:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Servidor SMTP de pruebas: recibe todo y lo muestra en http://localhost:8025. No envía nada afuera.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_PUERTO:-8025}:8025"
    restart: unless-stopped

  # Proceso independiente que entrega la cola de correos (RF-NOT-09). No arranca con `up`:
  #   docker compose run --rm enviador              una pasada
  #   docker compose run --rm enviador --vigilar 10 repite cada 10 segundos
  enviador:
    build:
      context: ./backend
      target: enviador
    profiles: ["herramientas"]
    environment:
      ConnectionStrings__Inventario: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      SMTP_HOST: ${SMTP_HOST:?Falta SMTP_HOST en .env}
      SMTP_PUERTO: ${SMTP_PUERTO:?Falta SMTP_PUERTO en .env}
      SMTP_SEGURIDAD: ${SMTP_SEGURIDAD:?Falta SMTP_SEGURIDAD en .env}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CONTRASENA: ${SMTP_CONTRASENA:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:?Falta SMTP_REMITENTE en .env}
    depends_on:
      db:
        condition: service_healthy

  # Pruebas de Control de acceso (RD-12). No necesitan la base ni la API:
  #   docker compose run --rm pruebas
  pruebas:
    build:
      context: ./backend
      target: pruebas
    profiles: ["herramientas"]

volumes:
  datos-postgres:
