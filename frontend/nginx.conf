server {
    listen 80;
    root /usr/share/nginx/html;

    # Los servicios se encuentran por su nombre en la red de compose (api, mailpit), nunca por localhost.
    # Se resuelven en cada petición con el DNS de Docker: si uno se detiene, nginx sigue sirviendo lo demás.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;
    set $mailpit http://mailpit:8025;

    # Los documentos pesan hasta 10 MB; la API rechaza con su propio mensaje lo que pase de eso.
    # Más allá de este límite responde nginx, también con un mensaje en JSON y no con una página HTML.
    client_max_body_size 50m;
    error_page 413 @demasiado_grande;

    # La API vive detrás del mismo origen: el navegador nunca habla directo con el backend.
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bandeja de Mailpit (correo de pruebas), para abrir los enlaces de activación y los códigos de recuperación
    # sin publicar otro puerto. Mailpit está configurado para servir en /correo/ (MP_WEBROOT).
    location /correo/ {
        proxy_pass $mailpit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /correo {
        return 301 /correo/;
    }

    # Rutas de React (por ejemplo /activar?token=...): siempre se entrega index.html.
    location / {
        try_files $uri /index.html;
    }

    location @demasiado_grande {
        default_type application/problem+json;
        return 413 '{"title":"Petición demasiado grande","status":413,"detail":"El archivo pasa del máximo de 10 MB. No se guardó."}';
    }
}
